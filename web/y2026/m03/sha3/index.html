<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF_8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device_width, initial_scale=1.0" />
    <title>SHA 3 Toolkit for Text</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {

            --bd-w: 1px;
            --bd-r: 12px;

            --c-txt: black;
            --c-bg: white;
            --c-info-bd: hsl(223, 79%, 85%);
            --c-info-bg: hsl(220, 76%, 97%);
            --c-info-txt: hsl(224, 76%, 50%);
            --c-info-1-bd: hsl(223, 79%, 75%);
            --c-info-1-bg: hsl(220, 76%, 87%);
            --c-info-1-txt: hsl(224, 76%, 40%);
            --c-gear-bd: hsl(219, 6%, 60%);
            --c-gear-bg: hsl(0, 0%, 85%);
            --c-gear-txt: hsl(217, 19%, 27%);
            --c-gear-1-bd: hsl(219, 10%, 60%);
            --c-gear-1-bg: hsl(0, 31%, 70%);
            --c-gear-1-txt: hsl(220, 18%, 35%);
            --c-ok-bd: hsl(141, 79%, 85%);
            --c-ok-bg: hsl(138, 76%, 97%);
            --c-ok-txt: hsl(142, 72%, 29%);
            --c-warning-bd: hsl(37, 90%, 65%);
            --c-warning-bg: hsl(34, 76%, 90%);
            --c-warning-txt: hsl(33, 72%, 40%);
            --c-warning-1-bd: hsl(37, 80%, 55%);
            --c-warning-1-bg: hsl(33, 76%, 80%);
            --c-warning-1-txt: hsl(33, 72%, 40%);
        }

        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 3rem 1rem;
            width: 100vw;
        }
    </style>
  </head>
  <body>
    <main id="app_main_id">
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
